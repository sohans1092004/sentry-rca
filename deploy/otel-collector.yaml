# OTLP in -> memory limiter -> tenant stamp -> batching -> Redpanda, keyed by service (SPEC §2, §6).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true # exposes the x-sentry-service request header as metadata

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50
  resource/tenant:
    # The tenant is decided here, server side; any value a client sends is overwritten.
    attributes:
      - key: sentry.tenant_id
        value: 00000000-0000-4000-8000-000000000001
        action: upsert
  batch:
    timeout: 1s
    send_batch_size: 1000
    metadata_keys: [x-sentry-service] # one batch per service, so the record key stays the service

exporters:
  kafka:
    brokers: [redpanda:9092]
    traces:
      topic: otel.traces.raw
      encoding: otlp_proto
      message_key_from_metadata_key: x-sentry-service
    metrics:
      topic: otel.metrics.raw
      encoding: otlp_proto
      message_key_from_metadata_key: x-sentry-service
    logs:
      topic: otel.logs.raw
      encoding: otlp_proto
      message_key_from_metadata_key: x-sentry-service
    producer:
      required_acks: -1
      compression: zstd
    # Bounded queue (SPEC §15 row 17): while Redpanda is down, batches wait here and are retried;
    # once full, new batches are dropped and counted in otelcol_exporter_enqueue_failed_*.
    sending_queue:
      enabled: true
      queue_size: 2000
      num_consumers: 4
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 0 # keep retrying; the queue bound, not a timer, decides what is dropped

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/tenant, batch]
      exporters: [kafka]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/tenant, batch]
      exporters: [kafka]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/tenant, batch]
      exporters: [kafka]
