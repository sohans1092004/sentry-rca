[project]
name = "sentry-rca"
version = "0.1.0"
description = "Incident-investigation platform: telemetry pipeline, alerting, failure injector (Phase 1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30",
    "clickhouse-connect>=0.8",
    "confluent-kafka>=2.6",
    "fastapi>=0.115",
    "httpx>=0.28",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-instrumentation-asyncpg>=0.50b0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "opentelemetry-proto>=1.29",
    "opentelemetry-sdk>=1.29",
    "psycopg[binary]>=3.2",
    "pyarrow>=18",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "testcontainers[clickhouse,kafka,postgres]>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "processors", "alerting", "services", "injector", "recorder"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["common.*", "processors.*", "alerting.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Docker (Testcontainers)"]
