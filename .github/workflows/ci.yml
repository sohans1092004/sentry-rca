name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.12.16" }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.12.16" }
      - run: uv sync --frozen
      - run: uv run mypy common processors alerting services injector recorder

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.12.16" }
      - run: uv sync --frozen
      - run: uv run pytest tests/unit -q

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.12.16" }
      - run: uv sync --frozen
      - run: uv run pytest tests/integration -q

  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.12.16" }
      - run: uv sync --frozen
      - uses: actions/cache@v5
        with:
          path: data/fixtures
          key: fixtures-${{ hashFiles('fixtures/index.json') }}
      - run: uv run python tools/fetch_fixtures.py # skips what the cache restored; verifies sha256
      - run: uv run pytest tests/fixtures -q
